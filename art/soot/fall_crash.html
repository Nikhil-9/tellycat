    hop_takeoff: { loop: false, duration: 0.33, note: 'From sitting: crouches, squashes, springs. Ends in the hop_air pose.', pose(t) {

    notice: { loop: false, duration: 1.2, note: 'You switched apps: ears perk forward, eyes go round, head lifts. Then "meh" and back to grumpy.', pose(t) {

      const Q = { hrot: -18, earL: -10, earR: 30, lid: 0.15, tilt: 0, lookX: 0, lookY: 0, mouth: 'flat', turn: 3 };

  const ORDER = ['idle_grumpy', 'idle_grumpy_2', 'idle_irritated', 'idle_furious', 'walk', 'run', 'skid_stop', 'hop_takeoff', 'hop_air', 'hop_land',
    'fall_air', 'fall_crash', 'dizzy', 'recover_angry', 'exhausted', 'tantrum', 'react_ok', 'react_back', 'leave_huff', 'fall_asleep', 'sleep', 'wake_grumpy',
    'notice', 'what', 'swept_tumble', 'calm_down', 'soft_moment'];
  function frameOf(clip, t) { const c = CLIPS[clip], d = c.duration, tt = c.loop ? ((t % d) + d) % d : clamp(t, 0, d);
    let fr = Math.floor(tt * FPS + 1e-6); if (!c.loop) fr = Math.min(fr, Math.round(d * FPS));
    const time = Math.min(fr / FPS, d), p = c.pose(time); p.ft = time; return { p, fr }; }
  function renderClip(clip, t, scale, lite) { const { p, fr } = frameOf(clip, t); p.lite = lite; return render(p, fr, scale, lite); }
  function renderPose(names, scale, frame) { return render(pose(...[].concat(names)), frame || 0, scale); }

  window.Soot = { FPS, C, POSES, FACES, CLIPS, ORDER, pose, render, renderClip, renderPose };
})();

// fall_crash: PLAYS ONCE, 0.5s, 12 drawings/s (7 unique drawings). Impact: flattens into a pancake with X eyes, bounces once, ends propped up and dazed.
(function(){
  var NAME="fall_crash", DURATION=0.5, LOOP=false, FPS=12, host=document.getElementById('cat');
  function draw(t){ var tmp=document.createElement('div'); tmp.innerHTML=window.Soot.renderClip(NAME,t,1,true); var svg=tmp.firstChild; svg.setAttribute('id','cat'); var old=document.getElementById('cat'); old.parentNode.replaceChild(svg,old); return t; }
  window.CAT_ANIM={name:NAME,duration:DURATION,loop:LOOP,fps:FPS,frameCount:Math.round(DURATION*FPS)+(LOOP?0:1),
    renderFrame:function(t){ return draw(Math.max(0, LOOP ? t : Math.min(DURATION, t))); },
    renderFrameIndex:function(i){ return draw(i/FPS); }};
  var q=new URLSearchParams(location.search);
  if(q.has('t')){draw(+q.get('t'));return;}
  if(q.has('frame')){draw(+q.get('frame')/FPS);return;}
  draw(0); if(q.has('paused')) return;
  var start=null, last=-1;
  function tick(now){ if(start===null)start=now; var t=(now-start)/1000;
    if(!LOOP){ if(t>DURATION+0.8){start=now;t=0;} t=Math.min(t,DURATION); }
    var fr=Math.floor((LOOP?t%DURATION:t)*FPS); if(fr!==last){last=fr; draw(t);} requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
})();
</script>
