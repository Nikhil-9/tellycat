name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apks:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to attach APKs to a release on tag pushes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Both APKs are built in the same run, so they share one (debug) signing key. That matters: Glow Home
      # talks to TellyCat through a signature-level permission.
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir dist
          cp tellycat/build/outputs/apk/debug/tellycat-debug.apk dist/TellyCat.apk
          cp glowhome/build/outputs/apk/debug/glowhome-debug.apk dist/GlowHome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TellyCat-apks
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
